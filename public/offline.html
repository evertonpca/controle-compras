<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f2d" />
    <title>Sem conexão — Minhas compras</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f6f0; color: #173f2d; font: 16px system-ui, sans-serif; }
      main { max-width: 380px; padding: 32px; text-align: center; }
      p { line-height: 1.6; }
      button { padding: 14px 20px; border: 0; border-radius: 12px; background: #176b45; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para consultar e registrar suas compras.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
